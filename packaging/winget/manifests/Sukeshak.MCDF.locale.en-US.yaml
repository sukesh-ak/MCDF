ShortDescription: Command-line tool for MCDF documents - Markdown containers you can validate, hash, sign, encrypt and render.
Description: |-
  MCDF treats a document as a container of plain Markdown, YAML, JSON and
  assets rather than a fixed-layout file, so it diffs in Git, machines can read
  its structure instead of guessing at it, and you can prove what it is and who
  wrote it.

  The mcdf command inspects and validates containers against all five
  conformance profiles, builds and verifies the integrity manifest, signs and
  verifies with Ed25519 or ECDSA P-256 via did:key, encrypts and decrypts with
  AES-256-GCM and HPKE, appends to and checks the hash-chained audit log,
  imports Markdown, EPUB and HTML, and renders to sanitized HTML or plain text.

  A single self-contained executable with no runtime dependencies.
