name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

# Cancel superseded runs on the same ref.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: ${{ matrix.name }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - { os: ubuntu-latest,  name: linux }
          - { os: windows-latest, name: windows }
          - { os: macos-latest,   name: macos }

    steps:
      - uses: actions/checkout@v5

      # vcpkg builds OpenSSL from source, so cache the installed tree.
      - name: Cache vcpkg packages
        uses: actions/cache@v5
        with:
          path: build/vcpkg_installed
          key: vcpkg-${{ runner.os }}-${{ hashFiles('vcpkg.json') }}
          restore-keys: vcpkg-${{ runner.os }}-

      # Uses each runner's preinstalled vcpkg and default generator (Make on
      # Linux/macOS, Visual Studio on Windows) - no extra tooling to install.
      - name: Configure
        shell: bash
        run: |
          cmake -B build -S . \
            -DCMAKE_BUILD_TYPE=Release \
            -DVCPKG_MANIFEST_FEATURES=tests \
            -DCMAKE_TOOLCHAIN_FILE="$VCPKG_INSTALLATION_ROOT/scripts/buildsystems/vcpkg.cmake"

      - name: Build
        run: cmake --build build --config Release --parallel

      - name: Test
        run: ctest --test-dir build -C Release --output-on-failure

      # mcdf_micro is built for a part chosen for its flash budget, so silent
      # size growth is a defect. This is the cheapest possible tripwire: print
      # .text/.rodata per gate configuration and let a human read the trend.
      # Linux only - `size` is a binutils tool and the number that matters is
      # the one from a cross-toolchain anyway.
      - name: Report mcdf_micro size per gate configuration
        if: runner.os == 'Linux'
        run: |
          for a in build/micro/libmcdf_micro*.a; do
            [ -e "$a" ] || continue   # a glob that matched nothing is not a failure
            printf '== %s\n' "$(basename "$a")"
            size -t "$a" | awk 'NR == 1 || $NF == "(TOTALS)"'
          done

  # Build the MCDF Studio GUI editor and publish the binary as an artifact.
  # GUI apps can't be launched headlessly in CI, so this verifies the build
  # compiles and links, then uploads the executable for manual testing.
  studio:
    name: studio-${{ matrix.name }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - { os: windows-latest, name: windows }
          - { os: ubuntu-latest,  name: linux }
          - { os: macos-latest,   name: macos }

    steps:
      - uses: actions/checkout@v5

      - name: Cache vcpkg packages
        uses: actions/cache@v5
        with:
          path: build/vcpkg_installed
          key: vcpkg-studio-${{ runner.os }}-${{ hashFiles('vcpkg.json') }}
          restore-keys: vcpkg-studio-${{ runner.os }}-

      # GLFW needs X11 / Wayland / OpenGL dev libraries on Linux; Windows uses
      # Win32/OpenGL that ship with the runner.
      - name: Install GUI system deps (Linux)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            xorg-dev libxkbcommon-dev libwayland-dev wayland-protocols \
            extra-cmake-modules libgl1-mesa-dev libglu1-mesa-dev xvfb

      - name: Configure
        shell: bash
        run: |
          cmake -B build -S . \
            -DCMAKE_BUILD_TYPE=Release \
            -DMCDF_BUILD_STUDIO=ON \
            -DMCDF_BUILD_TESTS=OFF \
            -DVCPKG_MANIFEST_FEATURES=studio \
            -DCMAKE_TOOLCHAIN_FILE="$VCPKG_INSTALLATION_ROOT/scripts/buildsystems/vcpkg.cmake"

      - name: Build Studio
        run: cmake --build build --config Release --parallel --target mcdf-studio

      # Offscreen crash check: hidden window under Xvfb, every
      # panel forced on against the signed showcase document, 120 frames.
      - name: UI smoke (offscreen)
        if: runner.os == 'Linux'
        run: xvfb-run -a ./build/apps/studio/mcdf-studio --smoke examples/showcase.mcdf

      - name: Upload Studio binary
        uses: actions/upload-artifact@v6
        with:
          name: mcdf-studio-${{ matrix.name }}
          path: |
            build/apps/studio/Release/mcdf-studio.exe
            build/apps/studio/mcdf-studio
          if-no-files-found: error

  # mcdf_micro on a 32-bit ABI. Every other job runs it 64-bit, but the parts it
  # is written for are 32-bit: size_t is four bytes there, so the uint64_t
  # container offsets stop being free and the arena's structs get smaller. That
  # difference is invisible to the rest of the matrix - it is how a suite ends
  # up encoding a 64-bit assumption without anyone choosing to.
  #
  # -m32 rather than an emulator on purpose: the same C, a few seconds, no
  # dependencies. What it cannot cover is target codegen and alignment, which is
  # what the toolchain build is for.
  micro-32bit:
    name: micro (32-bit)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - name: Install 32-bit toolchain
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends gcc-multilib g++-multilib

      # micro/ builds standalone with no dependencies at all, so this needs no
      # vcpkg and no cache.
      - name: Configure (-m32, all gate configurations)
        run: |
          cmake -B build32 -S micro -DCMAKE_BUILD_TYPE=Debug \
            -DCMAKE_C_FLAGS="-m32 -fsanitize=undefined -fno-sanitize-recover=undefined" \
            -DCMAKE_CXX_FLAGS="-m32 -fsanitize=undefined -fno-sanitize-recover=undefined" \
            -DCMAKE_EXE_LINKER_FLAGS="-m32 -fsanitize=undefined"

      - name: Build
        run: cmake --build build32 --parallel

      - name: Test
        run: ctest --test-dir build32 --output-on-failure

  # The ESP-IDF port, compiled for the two parts it targets.
  #
  # This is the only automated proof in the repository that touches the vendor
  # toolchain. There is no simulator here by decision, and device testing
  # happens by hand off CI - which raises what this job is worth and is the
  # argument for keeping it strict rather than permissive: warnings as errors,
  # every gate configuration that ships, and both architectures.
  #
  # Both, not one: esp32s3 is Xtensa and esp32p4 is RISC-V. A clean build of one
  # says nothing about the other, so neither is optional and a green tick on
  # half of this is not a green tick.
  #
  # What it proves is that the code compiles and links under IDF's warning set,
  # which is stricter than the host matrix in the places that bite embedded C.
  # It proves nothing about runtime behaviour on silicon - that is covered from
  # the other side, by the host matrix, the 32-bit job and the fuzzers, which
  # between them execute every parser, both profiles and the event stream.
  #
  # The image is pinned to an exact patch release, and to the one the maintainer
  # runs on the bench. Because device testing happens there by hand, a green
  # tick here should say something about the firmware that actually gets
  # flashed - and it says less the further CI's toolchain drifts from that one.
  # A moving branch tag would trade that for early warning of the vendor's
  # warning set tightening, which is worth less than the two agreeing. Bump it
  # deliberately, when the bench moves.
  idf:
    name: idf (esp32s3 + esp32p4)
    runs-on: ubuntu-latest
    container: espressif/idf:v6.0.1
    steps:
      - uses: actions/checkout@v5

      # Eight builds share one copy of IDF's own components per target, so the
      # cache is most of the job's wall clock.
      - name: Cache ccache
        uses: actions/cache@v5
        with:
          path: .ccache
          key: idf-ccache-${{ hashFiles('micro/**', '.github/workflows/ci.yml') }}
          restore-keys: idf-ccache-

      - name: Build every gate configuration, both targets
        shell: bash
        env:
          IDF_CCACHE_ENABLE: "1"
          CCACHE_DIR: ${{ github.workspace }}/.ccache
          CCACHE_MAXSIZE: 500M
        # Failures are collected rather than fatal on the first one: when the
        # Xtensa build passes and the RISC-V build does not, seeing both is the
        # whole diagnosis.
        run: |
          . "$IDF_PATH/export.sh"
          cd micro/port/esp-idf/example
          failed=()
          for target in esp32s3 esp32p4; do
            for cfg in core:OFF:OFF core-integrity:ON:OFF core-render:OFF:ON all-on:ON:ON; do
              name=${cfg%%:*}; rest=${cfg#*:}
              integrity=${rest%%:*}; render=${rest##*:}
              echo "::group::$target $name (INTEGRITY=$integrity RENDER=$render)"
              if idf.py -B "build-$target-$name" \
                        -D SDKCONFIG="sdkconfig.$target.$name" \
                        -D MCDF_MICRO_WERROR=ON \
                        -D MCDF_MICRO_ENABLE_INTEGRITY="$integrity" \
                        -D MCDF_MICRO_ENABLE_RENDER="$render" \
                        set-target "$target" build; then
                echo "::endgroup::"
              else
                echo "::endgroup::"
                echo "::error::$target $name failed to build"
                failed+=("$target/$name")
              fi
            done
          done
          if [ ${#failed[@]} -ne 0 ]; then
            printf 'failed: %s\n' "${failed[@]}"
            exit 1
          fi

      # The size number that actually matters, from the cross-toolchain: the
      # linux job prints the host one, which is only ever a trend line. This is
      # what the part pays. Reported, not asserted - a threshold in CI would
      # fail on the day someone adds a feature on purpose.
      - name: Report .text per target and gate configuration
        shell: bash
        run: |
          . "$IDF_PATH/export.sh"
          cd micro/port/esp-idf/example
          for lib in build-*/esp-idf/mcdf_micro/libmcdf_micro.a; do
            [ -e "$lib" ] || continue
            cfg=${lib#build-}; cfg=${cfg%%/*}
            case "$cfg" in
              esp32p4*) size=riscv32-esp-elf-size ;;
              *)        size=xtensa-esp32s3-elf-size ;;
            esac
            printf '== %s\n' "$cfg"
            "$size" -t "$lib" | awk 'NR == 1 || $NF == "(TOTALS)"'
          done

  # Coverage-guided fuzzing smoke: libFuzzer + ASan over the untrusted-input
  # surfaces (TAR unpack, YAML/JSON member parsers, markdown, the C reader).
  # Short seeded runs to catch regressions; longer campaigns are manual.
  fuzz:
    name: fuzz
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - name: Cache vcpkg packages
        uses: actions/cache@v5
        with:
          path: build/vcpkg_installed
          key: vcpkg-fuzz-${{ runner.os }}-${{ hashFiles('vcpkg.json') }}
          restore-keys: |
            vcpkg-fuzz-${{ runner.os }}-
            vcpkg-${{ runner.os }}-

      # The runner's stock clang 18 defines __cpp_concepts=201907, which makes
      # libstdc++ hide std::expected (the library's Result type) - clang 19+
      # re-landed the 202002 bump. Install clang 20 from apt.llvm.org.
      - name: Install Clang 20
        run: |
          wget -qO /tmp/llvm.sh https://apt.llvm.org/llvm.sh
          sudo bash /tmp/llvm.sh 20

      - name: Configure (clang + libFuzzer + ASan)
        env:
          CC: clang-20
          CXX: clang++-20
        run: |
          cmake -B build -S . \
            -DCMAKE_BUILD_TYPE=RelWithDebInfo \
            -DMCDF_BUILD_TESTS=OFF \
            -DMCDF_BUILD_FUZZERS=ON \
            -DMCDF_FUZZ_ENGINE=ON \
            -DCMAKE_C_FLAGS="-fsanitize=fuzzer-no-link,address" \
            -DCMAKE_CXX_FLAGS="-fsanitize=fuzzer-no-link,address" \
            -DVCPKG_MANIFEST_FEATURES= \
            -DCMAKE_TOOLCHAIN_FILE="$VCPKG_INSTALLATION_ROOT/scripts/buildsystems/vcpkg.cmake"

      - name: Build fuzzers
        run: |
          cmake --build build --parallel --target \
            fuzz_unpack fuzz_parsers fuzz_markdown \
            fuzz_micro_tar fuzz_micro_member fuzz_micro_render

      - name: Fuzz (30s per target, seeded)
        env:
          ASAN_OPTIONS: detect_leaks=0  # OpenSSL init tables trip LSan
        # First corpus dir is libFuzzer's WRITABLE output; keep the committed
        # seeds read-only by passing a scratch dir first.
        #
        # The mcdf_micro targets reuse the existing corpora rather than getting
        # copies: micro_tar walks archives (corpus/unpack), micro_member wraps
        # raw bytes as one member (corpus/parsers), and fuzzing both
        # implementations from the same inputs is the point.
        run: |
          fuzz_one() {  # target, seed dir
            mkdir -p "/tmp/corpus-$1"
            "./build/fuzz/fuzz_$1" -max_total_time=30 -print_final_stats=1 \
              "/tmp/corpus-$1" "$2"
          }
          for t in unpack parsers markdown; do fuzz_one "$t" "fuzz/corpus/$t"; done
          fuzz_one micro_tar fuzz/corpus/unpack
          fuzz_one micro_member fuzz/corpus/parsers
          fuzz_one micro_render fuzz/corpus/markdown

  # The reproducible Linux build, exactly as a contributor would run it.
  docker:
    name: docker
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - name: Build image (compiles, runs tests, emits the CLI)
        run: docker build -t mcdf:ci .
      - name: Smoke-test the CLI
        run: docker run --rm mcdf:ci --version
